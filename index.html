<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 8: Thấu Kính - Trò Chơi Lật Thẻ (Dark Neon)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050508;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      user-select: none;
    }

    /* Khung Game Chính - Phong cách Tối */
    .slide-container {
      width: 950px;
      height: 600px;
      background-color: #0d0f17;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.2), 0 15px 35px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 243, 255, 0.2);
    }

    .slide {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .slide.active {
      display: flex;
    }

    /* ================= SẢNH CHÍNH (SLIDE 1 - DARK NEON) ================= */
    #slide1 {
      background: radial-gradient(circle at center, #161b2e 0%, #0a0c14 70%, #05060a 100%);
      position: relative;
    }

    /* Họa tiết Lưới Neon phía sau */
    #slide1::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
    }

    /* Vòng tròn Quang học Neon xoay nhẹ */
    .bg-optics-ring {
      position: absolute;
      width: 500px;
      height: 500px;
      border: 2px dashed rgba(255, 0, 127, 0.25);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: inset 0 0 50px rgba(0, 243, 255, 0.05);
    }

    /* Bảng Tiêu Đề Neon */
    .lobby-header {
      z-index: 5;
      background: rgba(13, 15, 23, 0.75);
      padding: 25px 50px;
      border-radius: 28px;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.15);
      backdrop-filter: blur(10px);
      margin-bottom: 35px;
    }

    .title-main-lobby {
      font-size: 48px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
    }

    .title-sub-lobby {
      font-size: 42px;
      font-weight: 900;
      color: #ff007f;
      line-height: 1.2;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
    }

    /* Nút Play Neon */
    .play-btn {
      width: 175px;
      height: 95px;
      background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
      border-radius: 32px;
      border: 2px solid #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.8);
      outline: none;
      z-index: 5;
      animation: btnPulseNeon 2s infinite;
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-left: 36px solid #ffffff;
      margin-left: 8px;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.9));
    }

    .play-btn:hover {
      transform: scale(1.15) translateY(-3px);
      background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.8);
    }

    @keyframes btnPulseNeon {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.6); }
      50% { box-shadow: 0 0 35px rgba(0, 243, 255, 0.9), 0 0 10px #ff007f; }
    }

    /* Đồ họa trang trí Neon dạng đường nét phát sáng */
    .deco-item {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }

    /* Thấu kính trái Neon */
    .deco-lens-left {
      left: 35px;
      top: 110px;
      width: 160px;
      height: 220px;
      filter: drop-shadow(0 0 8px #00f3ff);
    }

    /* Kính phóng đại góc trái dưới Neon */
    .deco-magnifier {
      left: 45px;
      bottom: 35px;
      width: 150px;
      height: 150px;
      filter: drop-shadow(0 0 10px #ff007f);
    }

    /* Bộ thẻ góc phải dưới Neon */
    .deco-cards {
      right: 45px;
      bottom: 35px;
      width: 180px;
      height: 170px;
      filter: drop-shadow(0 0 10px #39ff14);
    }

    /* Thấu kính phải Neon */
    .deco-lens-right {
      right: 40px;
      top: 100px;
      width: 150px;
      height: 200px;
      filter: drop-shadow(0 0 8px #bf00ff);
    }

    /* Ngôi sao neon */
    .deco-star1 { top: 40px; left: 80px; width: 35px; filter: drop-shadow(0 0 6px #00f3ff); }
    .deco-star2 { top: 50px; right: 90px; width: 45px; filter: drop-shadow(0 0 8px #ff007f); }
    .deco-star3 { bottom: 180px; left: 240px; width: 25px; filter: drop-shadow(0 0 6px #39ff14); }
    .deco-star4 { bottom: 160px; right: 230px; width: 30px; filter: drop-shadow(0 0 6px #bf00ff); }

    /* ================= LƯỚI THẺ (SLIDE 2 - DARK NEON) ================= */
    #slide2 {
      background: radial-gradient(circle at center, #121624 0%, #080a10 100%);
    }

    .grid-title {
      font-size: 28px;
      font-weight: 900;
      color: #00f3ff;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      width: 100%;
      max-width: 850px;
      perspective: 1000px;
    }

    .card-item {
      height: 170px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .card-item:hover {
      transform: scale(1.1);
      z-index: 10;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 14px;
    }

    .card-item.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .card-front {
      font-size: 38px;
      font-weight: 900;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .card-front::after {
      content: '';
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      pointer-events: none;
    }

    /* Các màu Neon cho Thẻ */
    .card-red { background: #2a080c; border-color: #ff2a4b; color: #ff2a4b; box-shadow: inset 0 0 15px rgba(255, 42, 75, 0.3), 0 0 10px rgba(255, 42, 75, 0.4); }
    .card-blue { background: #081a2a; border-color: #00f3ff; color: #00f3ff; box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.3), 0 0 10px rgba(0, 243, 255, 0.4); }
    .card-green { background: #082a12; border-color: #39ff14; color: #39ff14; box-shadow: inset 0 0 15px rgba(57, 255, 20, 0.3), 0 0 10px rgba(57, 255, 20, 0.4); }
    .card-yellow { background: #2a2508; border-color: #ffe600; color: #ffe600; box-shadow: inset 0 0 15px rgba(255, 230, 0, 0.3), 0 0 10px rgba(255, 230, 0, 0.4); }
    .card-orange { background: #2a1508; border-color: #ff7700; color: #ff7700; box-shadow: inset 0 0 15px rgba(255, 119, 0, 0.3), 0 0 10px rgba(255, 119, 0, 0.4); }
    .card-purple { background: #20082a; border-color: #bf00ff; color: #bf00ff; box-shadow: inset 0 0 15px rgba(191, 0, 255, 0.3), 0 0 10px rgba(191, 0, 255, 0.4); }
    .card-pink { background: #2a081a; border-color: #ff007f; color: #ff007f; box-shadow: inset 0 0 15px rgba(255, 0, 127, 0.3), 0 0 10px rgba(255, 0, 127, 0.4); }
    .card-white { background: #1a1e28; border-color: #ffffff; color: #ffffff; box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.2), 0 0 10px rgba(255, 255, 255, 0.3); }
    .card-dark { background: #11131a; border-color: #7000ff; color: #b377ff; box-shadow: inset 0 0 15px rgba(112, 0, 255, 0.3), 0 0 10px rgba(112, 0, 255, 0.4); }
    .card-brown { background: #221408; border-color: #ffaa44; color: #ffaa44; box-shadow: inset 0 0 15px rgba(255, 170, 68, 0.3), 0 0 10px rgba(255, 170, 68, 0.4); }

    .card-back {
      background: #052e16;
      color: #39ff14;
      font-size: 18px;
      font-weight: 900;
      transform: rotateY(180deg);
      padding: 5px;
      border: 2px solid #39ff14;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
    }

    .back-btn {
      margin-top: 25px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border: 1px solid #00f3ff;
      background-color: rgba(0, 243, 255, 0.1);
      color: #00f3ff;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background-color: #00f3ff;
      color: #0d0f17;
      box-shadow: 0 0 15px #00f3ff;
    }

    /* Modal Hộp thoại Câu Hỏi Neon */
    .modal-question {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(5, 6, 10, 0.92);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      z-index: 100;
    }

    .modal-question.active { display: flex; }

    .q-title {
      font-size: 20px;
      margin-bottom: 20px;
      color: #ffe600;
      max-width: 85%;
      line-height: 1.4;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.5);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 85%;
      margin-bottom: 20px;
    }

    .opt-btn {
      padding: 12px 18px;
      background-color: #161b26;
      color: #ffffff;
      border: 1px solid #00f3ff;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .opt-btn:hover {
      background-color: #00f3ff;
      color: #000000;
      font-weight: bold;
      box-shadow: 0 0 12px #00f3ff;
    }

    .close-q-btn {
      padding: 8px 20px;
      background-color: transparent;
      color: #ff2a4b;
      border: 1px solid #ff2a4b;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .close-q-btn:hover {
      background-color: #ff2a4b;
      color: #ffffff;
      box-shadow: 0 0 10px #ff2a4b;
    }

    /* Modal Banner Thông Báo Neon */
    .modal-status {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .modal-status.active { display: flex; }

    .status-banner {
      width: 650px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      border-radius: 20px;
      color: #ffffff;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 1px;
      animation: bannerPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: 0 0 15px currentColor;
    }

    .status-banner.success { 
      background: #072710;
      border: 3px solid #39ff14;
      color: #39ff14;
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.6);
    }
    .status-banner.error { 
      background: #2a060a;
      border: 3px solid #ff0055;
      color: #ff0055;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
    }
    .status-banner.info {
      background: #081b2a;
      border: 3px solid #00f3ff;
      color: #00f3ff;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
      font-size: 38px;
    }

    .status-icon-box {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-icon-box svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px currentColor);
    }

    @keyframes bannerPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="slide-container">
    
    <!-- Slide 1: Sảnh chính Dark Neon -->
    <div class="slide active" id="slide1">
      
      <div class="bg-optics-ring"></div>

      <!-- Bảng tiêu đề -->
      <div class="lobby-header">
        <h1 class="title-main-lobby">BÀI 8 : THẤU KÍNH</h1>
        <h2 class="title-sub-lobby">TRÒ CHƠI LẬT THẺ</h2>
      </div>
      
      <!-- Nút Play -->
      <button class="play-btn" id="btnStartGame" aria-label="Chơi ngay">
        <div class="play-icon"></div>
      </button>

      <!-- Đồ họa thấu kính bên trái Neon -->
      <svg class="deco-item deco-lens-left" viewBox="0 0 100 150">
        <path d="M0 40 L50 75 L100 40" stroke="#00f3ff" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
        <path d="M0 110 L50 75 L100 110" stroke="#00f3ff" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
        <path d="M50 10 Q35 75 50 140 Q65 75 50 10 Z" fill="rgba(0, 243, 255, 0.2)" stroke="#00f3ff" stroke-width="4"/>
      </svg>

      <!-- Đồ họa kính phóng đại bên trái dưới Neon -->
      <svg class="deco-item deco-magnifier" viewBox="0 0 100 100">
        <circle cx="42" cy="42" r="30" fill="rgba(255,0,127,0.15)" stroke="#ff007f" stroke-width="6"/>
        <line x1="64" y1="64" x2="90" y2="90" stroke="#ff007f" stroke-width="10" stroke-linecap="round"/>
        <path d="M25 35 Q35 20 50 25" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>

      <!-- Đồ họa thấu kính bên phải Neon -->
      <svg class="deco-item deco-lens-right" viewBox="0 0 100 150">
        <line x1="10" y1="75" x2="90" y2="75" stroke="#bf00ff" stroke-width="3" stroke-dasharray="5 5"/>
        <circle cx="50" cy="75" r="5" fill="#bf00ff"/>
        <path d="M35 15 L65 15 Q52 75 65 135 L35 135 Q48 75 35 15 Z" fill="rgba(191, 0, 255, 0.2)" stroke="#bf00ff" stroke-width="4"/>
      </svg>

      <!-- Đồ họa các thẻ câu hỏi góc phải dưới Neon -->
      <svg class="deco-item deco-cards" viewBox="0 0 120 120">
        <g transform="rotate(-20 50 60)">
          <rect x="20" y="20" width="55" height="75" rx="8" fill="#122b10" stroke="#39ff14" stroke-width="3"/>
          <rect x="25" y="25" width="45" height="65" rx="5" fill="none" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="3 3"/>
        </g>
        <g transform="rotate(15 65 55)">
          <rect x="40" y="15" width="55" height="75" rx="8" fill="#2b0a1a" stroke="#ff007f" stroke-width="3"/>
          <rect x="45" y="20" width="45" height="65" rx="5" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="3 3"/>
        </g>
      </svg>

      <!-- Ngôi sao lấp lánh trang trí -->
      <svg class="deco-item deco-star1" viewBox="0 0 40 40"><path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#00f3ff"/></svg>
      <svg class="deco-item deco-star2" viewBox="0 0 40 40"><path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#ff007f"/></svg>
      <svg class="deco-item deco-star3" viewBox="0 0 40 40"><path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#39ff14"/></svg>
      <svg class="deco-item deco-star4" viewBox="0 0 40 40"><path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#bf00ff"/></svg>

    </div>

    <!-- Slide 2: Lưới thẻ câu hỏi Dark Neon -->
    <div class="slide" id="slide2">
      <h3 class="grid-title">CHỌN THẺ CÂU HỎI</h3>
      <div class="card-grid">
        <div class="card-item" onclick="handleCardClick(1, this)">
          <div class="card-inner">
            <div class="card-front card-red">1</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(2, this)">
          <div class="card-inner">
            <div class="card-front card-blue">2</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(3, this)">
          <div class="card-inner">
            <div class="card-front card-green">3</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(4, this)">
          <div class="card-inner">
            <div class="card-front card-yellow">4</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(5, this)">
          <div class="card-inner">
            <div class="card-front card-orange">5</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(6, this)">
          <div class="card-inner">
            <div class="card-front card-purple">6</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(7, this)">
          <div class="card-inner">
            <div class="card-front card-pink">7</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(8, this)">
          <div class="card-inner">
            <div class="card-front card-white">8</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(9, this)">
          <div class="card-inner">
            <div class="card-front card-dark">9</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(10, this)">
          <div class="card-inner">
            <div class="card-front card-brown">10</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
      </div>
      <button class="back-btn" onclick="goToSlide(1)">❮ Quay lại</button>
    </div>

    <!-- Modal Hộp thoại Câu Hỏi -->
    <div class="modal-question" id="modalQ">
      <h3 class="q-title" id="qText">Câu hỏi...</h3>
      <div class="options-grid" id="optionsBox"></div>
      <button class="close-q-btn" onclick="closeQuestion()">Đóng & Quay lại lưới thẻ</button>
    </div>

    <!-- Modal Banner Thông Báo -->
    <div class="modal-status" id="modalStatus" onclick="closeStatusModal()">
      <div class="status-banner" id="statusBanner">
        <span class="status-icon-box" id="statusIcon"></span>
        <span id="statusText">Trả lời đúng</span>
      </div>
    </div>

  </div>

  <script>
    const questionsData = {
      1: {
        title: "Câu 1: Thấu kính là một khối như thế nào?",
        options: [
          "A. Đục, đồng chất",
          "B. Trong suốt, không đồng chất",
          "C. Trong suốt và đồng chất, giới hạn bởi 2 mặt cong hoặc bởi 1 mặt cong và 1 mặt phẳng",
          "D. Mờ đục và đồng chất, không giới hạn bởi 2 mặt cong hoặc bởi 1 mặt cong và 1 phẳng"
        ],
        correct: 2
      },
      2: {
        title: "Câu 2: Thấu kính có bao nhiêu loại?",
        options: [

    let currentCardElement = null;

    function goToSlide(slideNumber) {
      document.querySelectorAll('.slide').forEach(slide => slide.classList.remove('active'));
      const targetSlide = document.getElementById('slide' + slideNumber);
      if (targetSlide) {
        targetSlide.classList.add('active');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const btnPlay = document.getElementById('btnStartGame');
      if (btnPlay) {
        btnPlay.addEventListener('click', () => {
          goToSlide(2);
        });
      }
    });

    function handleCardClick(cardNum, cardEl) {
      if (cardEl.classList.contains('flipped')) {
        showAlreadyAnsweredModal();
        return;
      }
      
      currentCardElement = cardEl;
      const qData = questionsData[cardNum];
      document.getElementById('qText').innerText = qData.title;
      const optionsBox = document.getElementById('optionsBox');
      optionsBox.innerHTML = '';
      
      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx === qData.correct);
        optionsBox.appendChild(btn);
      });

      document.getElementById('modalQ').classList.add('active');
    }

    function closeQuestion() {
      document.getElementById('modalQ').classList.remove('active');
    }

    function checkAnswer(isCorrect) {
      if (currentCardElement) {
        currentCardElement.classList.add('flipped');
      }

      const banner = document.getElementById('statusBanner');
      const text = document.getElementById('statusText');
      const icon = document.getElementById('statusIcon');

      if (isCorrect) {
        banner.className = 'status-banner success';
        text.innerText = 'Trả lời đúng';
        icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      } else {
        banner.className = 'status-banner error';
        text.innerText = 'Trả lời sai';
        icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
      }

      document.getElementById('modalStatus').classList.add('active');
    }

    function showAlreadyAnsweredModal() {
      const banner = document.getElementById('statusBanner');
      const text = document.getElementById('statusText');
      const icon = document.getElementById('statusIcon');

      banner.className = 'status-banner info';
      text.innerText = 'Bạn đã trả lời rồi!';
      icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;

      document.getElementById('modalStatus').classList.add('active');
    }

    function closeStatusModal() {
      document.getElementById('modalStatus').classList.remove('active');
      closeQuestion();
    }
  </script>
